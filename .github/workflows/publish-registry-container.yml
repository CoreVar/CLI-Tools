name: Publish CLI Registry Container

on:
  push:
    branches: ['releases/**', 'prereleases/**']
    paths:
      - 'src/CommandLineInterface.Registry/**'
      - 'src/CommandLineInterface.Distribution/**'
      - 'src/CommandLineInterface.Modules/**'
      - 'src/CommandLineInterface.Publishing/**'
      - '.github/workflows/publish-registry-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/corevar/cli-registry
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/releases/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/CommandLineInterface.Registry/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
