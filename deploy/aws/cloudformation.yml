AWSTemplateFormatVersion: '2010-09-09'
Description: Self-hosted CoreVar CLI Registry on an EC2 Docker host
Parameters:
  Tenant: { Type: String, Default: demo }
  PublishKey: { Type: String, NoEcho: true }
  Image: { Type: String, Default: ghcr.io/corevar/cli-registry:latest }
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CoreVar CLI Registry HTTP
      SecurityGroupIngress: [{ IpProtocol: tcp, FromPort: 8080, ToPort: 8080, CidrIp: 0.0.0.0/0 }]
  Host:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: t3.micro
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 12, VolumeType: gp3, DeleteOnTermination: false }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /opt/corevar-cli-registry
          docker run -d --restart unless-stopped --name corevar-cli-registry -p 8080:8080 \
            -e COREVAR_REGISTRY_DATA=/data -e 'COREVAR_REGISTRY_API_KEYS=${Tenant}=${PublishKey}' \
            -v /opt/corevar-cli-registry:/data ${Image}
Outputs:
  Endpoint: { Value: !Sub 'http://${Host.PublicDnsName}:8080/' }
